<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panvelkar Estate Stanford — Photo Gallery</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f2e8d5;color:#25231e;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}.top{background:linear-gradient(135deg,#1f4b43,#2e6b5e);color:#fff;border-bottom:4px solid #c9a227;border-radius:18px;padding:22px;margin-bottom:18px}.top h1{margin:0 0 6px}.card{background:#fbf7ef;border:1px solid #e3d8bd;border-radius:16px;padding:18px;margin-bottom:16px}.albums{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.album{background:#fff;border:1px solid #e3d8bd;border-radius:14px;overflow:hidden}.cover{aspect-ratio:16/10;background:#eee;display:flex;align-items:center;justify-content:center}.cover img{width:100%;height:100%;object-fit:cover}.albumbody{padding:14px}.muted{color:#686256;font-size:13px}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:750;background:#1f4b43;color:#fff;cursor:pointer}.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:#eee}.empty{text-align:center;padding:28px;color:#686256}@media(max-width:800px){.albums{grid-template-columns:repeat(2,1fr)}.photos{grid-template-columns:repeat(3,1fr)}}@media(max-width:520px){.albums{grid-template-columns:1fr}.photos{grid-template-columns:repeat(2,1fr)}.wrap{padding:12px}}</style></head><body><div class="wrap"><header class="top"><h1>📸 Photo Gallery</h1><div>Panvelkar Estate Stanford</div></header><div id="app" class="card"><div class="empty">Loading gallery…</div></div></div><script>const URL='https://zawatmovyrjcpgxkqcqq.supabase.co',db=supabase.createClient(URL,'sb_publishable_x9u_XeQlrOil8VRZ6Kcbjg_48JRq51y');const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function load(){const a=await db.from('gallery_albums').select('id,title,description,event_date,visibility_scope').eq('published',true).order('event_date',{ascending:false,nullsFirst:false});if(a.error)throw a.error;const s=(await db.auth.getSession()).data.session;const rows=s?a.data||[]:(a.data||[]).filter(x=>x.visibility_scope==='public');const app=document.getElementById('app');if(!rows.length){app.innerHTML='<div class="empty">No published albums yet.</div>';return}app.innerHTML='<div class="albums">'+rows.map(x=>'<article class="album"><div class="cover" id="cover'+x.id+'">📷</div><div class="albumbody"><h3>'+esc(x.title)+'</h3><div class="muted">'+esc(x.event_date||'')+'</div><p>'+esc(x.description||'')+'</p><button class="btn" onclick="openAlbum(\''+esc(x.id)+'\')">View Photos</button></div></article>').join('')+'</div>'}async function openAlbum(id){const a=await db.from('gallery_albums').select('id,title,description,event_date,visibility_scope').eq('id',id).single();if(a.error)throw a.error;const r=await db.from('gallery_photos').select('id,file_name').eq('album_id',id).order('sort_order');if(r.error)throw r.error;const s=(await db.auth.getSession()).data.session;document.getElementById('app').innerHTML='<button class="btn" onclick="load()">← Back to Albums</button><h2>'+esc(a.data.title)+'</h2><p class="muted">'+esc(a.data.description||'')+'</p><div class="photos">'+(r.data||[]).map(x=>'<div id="p'+x.id+'">Loading…</div>').join('')+'</div>';for(const x of r.data||[]){const h=s?{Authorization:'Bearer '+s.access_token}:{};const z=await fetch(URL+'/functions/v1/content-signed-url',{method:'POST',headers:{'content-type':'application/json',...h},body:JSON.stringify({type:'gallery',id:x.id})});const j=await z.json();if(z.ok&&j.url)document.getElementById('p'+x.id).innerHTML='<img src="'+esc(j.url)+'" alt="'+esc(x.file_name)+'">'}}load().catch(e=>document.getElementById('app').innerHTML='<div class="empty">Unable to load gallery.</div>');</script></body></html>
