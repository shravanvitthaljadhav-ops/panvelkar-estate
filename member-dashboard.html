<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panvelkar Estate Stanford — Member Dashboard</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--navy:#173f3a;--teal:#245f55;--gold:#c7a33a;--cream:#fbf8f0;--sand:#f1e8d7;--ink:#22211d;--muted:#6b665b;--line:#e1d7c3}*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans Devanagari",system-ui,sans-serif;background:var(--sand);color:var(--ink)}button,select,input,textarea{font:inherit}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:linear-gradient(180deg,var(--navy),#12332f);color:var(--cream);padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;gap:10px;align-items:center;padding:8px 8px 18px;border-bottom:1px solid #ffffff20}.logo{width:38px;height:38px;border-radius:11px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-weight:900}.brand b{font-size:14px}.lang{width:100%;margin-top:13px;padding:9px;border-radius:9px;background:#ffffff12;color:var(--cream);border:1px solid #ffffff35}.lang option{color:#222;background:#fff}.group{font-size:10px;opacity:.5;margin:18px 8px 6px;text-transform:uppercase;letter-spacing:.08em}.nav button{width:100%;border:0;background:transparent;color:#ffffffcc;text-align:left;padding:10px 11px;border-radius:10px;margin:2px 0;cursor:pointer}.nav button:hover,.nav button.active{background:var(--gold);color:var(--navy);font-weight:800}.main{padding:25px 32px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.top h1{margin:0;color:var(--navy);font-size:25px}.sub{color:var(--muted);font-size:12px}.profile{background:var(--cream);border:1px solid var(--line);padding:7px 12px;border-radius:999px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.stat{background:var(--cream);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px #261f140d}.stat{padding:17px}.stat b{display:block;font-size:24px;color:var(--navy);margin-top:8px}.section{margin-top:18px;padding:20px}.section h2{margin:0 0 14px;color:var(--navy);font-size:18px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.tile{border:1px solid var(--line);border-radius:12px;background:#fffdf8;padding:15px;min-height:82px;text-align:left;cursor:pointer}.tile:hover,.tile.active{border-color:var(--gold);box-shadow:0 7px 18px #173f3a14}.ico{font-size:20px;display:block;margin-bottom:6px}.panel{margin-top:18px;padding:20px;min-height:250px}.rows .row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}.status{padding:4px 9px;border-radius:99px;background:#fff4cf;color:#8a6200;font-size:11px;font-weight:800}.ok{background:#e7f2e7;color:#397044}.btn{border:0;background:var(--gold);color:var(--navy);font-weight:900;padding:10px 16px;border-radius:9px;cursor:pointer}.input{width:100%;padding:10px;margin:6px 0 9px;border:1px solid var(--line);border-radius:9px;background:#fff}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.notice{padding:12px 0;border-bottom:1px solid var(--line)}.notice:last-child{border:0}.msg{margin-top:10px;font-weight:800}.error{color:#a33f25}.success{color:#397044}.hidden{display:none!important}@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:static;height:auto}.stats,.grid4{grid-template-columns:repeat(2,1fr)}.main{padding:18px}.nav{display:grid;grid-template-columns:repeat(2,1fr);gap:3px}}@media(max-width:560px){.stats,.grid4,.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.top{align-items:flex-start;gap:10px;flex-direction:column}.profile{align-self:flex-end}}</style></head><body><div class="app"><aside class="side"><div class="brand"><span class="logo">PE</span><b>Panvelkar Estate<br>Stanford</b></div><select id="lang" class="lang"><option value="mr">मराठी</option><option value="en">English</option><option value="hi">हिंदी</option></select><div class="group" id="g1">आढावा</div><nav class="nav"><button class="active" data-v="home">🏠 <span data-k="dashboard">डॅशबोर्ड</span></button></nav><div class="group">My Property</div><nav class="nav"><button data-v="profile">👤 <span data-k="profile">माझे प्रोफाईल</span></button><button data-v="flat">🏢 <span data-k="flat">माझा फ्लॅट</span></button><button data-v="coowners">👥 <span data-k="coowners">सहमालक</span></button><button data-v="pets">🐾 <span data-k="pets">पाळीव प्राणी</span></button><button data-v="vehicles">🚗 <span data-k="vehicles">वाहने</span></button><button data-v="documents">📄 <span data-k="documents">कागदपत्रे</span></button></nav><div class="group">My Society</div><nav class="nav"><button data-v="maintenance">💳 <span data-k="maintenance">मेंटेनन्स</span></button><button data-v="complaints">🛠️ <span data-k="complaints">तक्रारी</span></button><button data-v="garden">🌿 <span data-k="garden">Garden Function Booking</span></button><button data-v="notices">📢 <span data-k="notices">सूचना</span></button></nav><div class="group">Account</div><nav class="nav"><button onclick="signout()">↪️ <span data-k="logout">लॉगआउट</span></button></nav></aside><main class="main"><div class="top"><div><div class="sub">Member Dashboard</div><h1 id="welcome">नमस्कार</h1><div class="sub" id="unitLabel">—</div></div><div class="profile" id="email">—</div></div><section id="home" class="view"><div class="stats"><div class="stat">💳 <b id="due">₹ 0</b><span data-k="pending">प्रलंबित मेंटेनन्स</span></div><div class="stat">👥 <b id="people">0</b><span data-k="people">कुटुंबातील सदस्य</span></div><div class="stat">🐾 <b id="pets">0</b><span data-k="pets">पाळीव प्राणी</span></div><div class="stat">🚗 <b id="vehicles">0</b><span data-k="vehicles">वाहने</span></div></div><div class="section"><h2 data-k="quick">महत्त्वाची माहिती</h2><div class="grid4"><button class="tile" data-v="maintenance">💳<b data-k="pending">प्रलंबित मेंटेनन्स</b><small id="dueAlert">—</small></button><button class="tile" data-v="notices">📢<b data-k="notice">सूचना</b><small id="noticeAlert">—</small></button><button class="tile" data-v="complaints">🛠️<b data-k="open">ओपन कम्प्लेंट</b><small id="complaintAlert">—</small></button><button class="tile" data-v="garden">🌿<b data-k="garden">Garden Function Booking</b><small data-k="gardenSub">कार्यक्रमासाठी बुकिंग विनंती</small></button></div></div><div class="section"><h2 data-k="property">माझी मालमत्ता</h2><div class="grid4"><button class="tile" data-v="profile">👤<b data-k="profile">माझे प्रोफाईल</b></button><button class="tile" data-v="flat">🏢<b data-k="flat">माझा फ्लॅट</b></button><button class="tile" data-v="coowners">👥<b data-k="coowners">सहमालक</b></button><button class="tile" data-v="pets">🐾<b data-k="pets">पाळीव प्राणी</b></button></div></div><div class="section"><h2 data-k="services">माझ्या सेवा</h2><div class="grid4"><button class="tile" data-v="vehicles">🚗<b data-k="vehicles">वाहने</b></button><button class="tile" data-v="documents">📄<b data-k="documents">कागदपत्रे</b></button><button class="tile" data-v="maintenance">💳<b data-k="maintenance">मेंटेनन्स</b></button><button class="tile" data-v="complaints">🛠️<b data-k="complaints">तक्रारी</b></button><button class="tile" data-v="garden">🌿<b data-k="garden">Garden Function Booking</b></button></div></div><div class="section"><h2 data-k="society">सोसायटी</h2><div class="grid4"><button class="tile" data-v="notices">📢<b data-k="notice">सूचना</b></button><button class="tile" data-v="garden">🌿<b data-k="garden">Garden Function Booking</b></button></div></div></section><section id="detail" class="card panel hidden"></section></main></div><script>const URL='https://zawatmovyrjcpgxkqcqq.supabase.co',KEY='sb_publishable_x9u_XeQlrOil8VRZ6Kcbjg_48JRq51y',db=supabase.createClient(URL,KEY);let profile=null,unit=null,lang=localStorage.getItem('stanford_lang')||'mr';const T={mr:{dashboard:'डॅशबोर्ड',profile:'माझे प्रोफाईल',flat:'माझा फ्लॅट',coowners:'सहमालक',pets:'पाळीव प्राणी',vehicles:'वाहने',documents:'कागदपत्रे',maintenance:'मेंटेनन्स',complaints:'तक्रारी',garden:'Garden Function Booking',notices:'सूचना',logout:'लॉगआउट',pending:'प्रलंबित मेंटेनन्स',people:'कुटुंबातील सदस्य',notice:'सूचना',open:'ओपन कम्प्लेंट',quick:'महत्त्वाची माहिती',property:'माझी मालमत्ता',services:'माझ्या सेवा',society:'सोसायटी',gardenSub:'कार्यक्रमासाठी बुकिंग विनंती',send:'Admin कडे Approval साठी पाठवा',sent:'विनंती Admin कडे Approval साठी पाठवली आहे.'},en:{dashboard:'Dashboard',profile:'My Profile',flat:'My Flat',coowners:'Co-Owners',pets:'Pets',vehicles:'Vehicles',documents:'Documents',maintenance:'Maintenance',complaints:'Complaints',garden:'Garden Function Booking',notices:'Notices',logout:'Logout',pending:'Pending Maintenance',people:'Household People',notice:'Notice',open:'Open Complaint',quick:'Important Information',property:'My Property',services:'My Services',society:'Society',gardenSub:'Booking request for function / event',send:'Send to Admin for Approval',sent:'Request sent to Admin for approval.'},hi:{dashboard:'डैशबोर्ड',profile:'मेरी प्रोफ़ाइल',flat:'मेरा फ्लैट',coowners:'सह-मालिक',pets:'पालतू जानवर',vehicles:'वाहन',documents:'दस्तावेज़',maintenance:'मेंटेनेंस',complaints:'शिकायतें',garden:'Garden Function Booking',notices:'सूचनाएँ',logout:'लॉगआउट',pending:'लंबित मेंटेनेंस',people:'परिवार के सदस्य',notice:'सूचना',open:'ओपन शिकायत',quick:'महत्वपूर्ण जानकारी',property:'मेरी संपत्ति',services:'मेरी सेवाएँ',society:'सोसायटी',gardenSub:'कार्यक्रम के लिए बुकिंग अनुरोध',send:'Admin को Approval के लिए भेजें',sent:'अनुरोध Admin को Approval के लिए भेज दिया गया है।'}};const tr=k=>T[lang][k]||k;function digits(v){return String(v??'').replace(/[0-9]/g,c=>lang==='en'?c:'०१२३४५६७८९'[+c])}function money(n){return '₹ '+digits(Number(n||0).toLocaleString('en-IN'))}function applyLang(){document.querySelectorAll('[data-k]').forEach(e=>e.textContent=tr(e.dataset.k));document.documentElement.lang=lang;localStorage.setItem('stanford_lang',lang)}async function init(){const {data:{session}}=await db.auth.getSession();if(!session){location.href='portal.html';return}const r=await db.from('profiles').select('id,full_name,email,unit_id,role,active').eq('id',session.user.id).maybeSingle();if(r.error||!r.data||!r.data.active||String(r.data.role).toLowerCase()!=='member'){location.href='portal.html';return}profile=r.data;const u=await db.from('units').select('id,unit_number,wing_id').eq('id',profile.unit_id).maybeSingle();unit=u.data||{};let wing='';if(unit.wing_id){const w=await db.from('wings').select('code').eq('id',unit.wing_id).maybeSingle();wing=w.data?.code||''}unit.wing=wing;document.getElementById('welcome').textContent=tr('dashboard')+' — '+profile.full_name;document.getElementById('email').textContent=profile.email;document.getElementById('unitLabel').textContent=(wing?wing+' · ':'')+tr('flat')+' '+(unit.unit_number||'—');await loadData();applyLang()}async function loadData(){const [m,h,p,v,c,n]=await Promise.all([db.from('maintenance_dues').select('amount_due,amount_paid').eq('unit_id',profile.unit_id).in('status',['due','partial']).order('due_date',{ascending:true}).limit(1).maybeSingle(),db.from('households').select('people_count').eq('unit_id',profile.unit_id).eq('active',true).maybeSingle(),db.from('pets').select('pet_count').eq('unit_id',profile.unit_id).eq('active',true),db.from('vehicles').select('id').eq('unit_id',profile.unit_id).eq('active',true),db.from('change_requests').select('id').eq('requested_by',profile.id).eq('request_type','complaint').in('status',['open','in_progress']),db.from('notices').select('id,title,body,published_at').eq('published',true).order('published_at',{ascending:false}).limit(5)]);const due=m.data?Math.max(0,Number(m.data.amount_due||0)-Number(m.data.amount_paid||0)):0;document.getElementById('due').textContent=money(due);document.getElementById('dueAlert').textContent=money(due);document.getElementById('people').textContent=digits(h.data?.people_count||0);document.getElementById('pets').textContent=digits((p.data||[]).reduce((s,x)=>s+Number(x.pet_count||0),0));document.getElementById('vehicles').textContent=digits(v.data?.length||0);document.getElementById('complaintAlert').textContent=digits(c.data?.length||0)+' '+tr('complaints');document.getElementById('noticeAlert').textContent=digits(n.data?.length||0)+' '+tr('notice');window._notices=n.data||[]}async function view(v){document.getElementById('home').classList.add('hidden');const d=document.getElementById('detail');d.classList.remove('hidden');if(v==='garden'){d.innerHTML='<h2>'+tr('garden')+'</h2><p class="sub">'+tr('gardenSub')+'</p><form id="gf"><div class="formgrid"><input class="input" id="ename" required placeholder="Event name"><input class="input" id="edate" required type="date"><input class="input" id="estart" required type="time"><input class="input" id="eend" required type="time"><input class="input" id="eguests" required type="number" min="1" placeholder="Expected attendance"><textarea class="input full" id="enotes" rows="3" placeholder="Additional information"></textarea></div><button class="btn" type="submit">'+tr('send')+'</button><div id="gm" class="msg"></div></form>';document.getElementById('gf').onsubmit=async e=>{e.preventDefault();const msg=document.getElementById('gm');if(eend.value<=estart.value){msg.textContent='End time must be after start time.';msg.className='msg error';return}const r=await db.from('garden_area_bookings').insert({requested_by:profile.id,unit_id:profile.unit_id,event_name:ename.value.trim(),event_date:edate.value,start_time:estart.value,end_time:eend.value,expected_attendance:Number(eguests.value),notes:enotes.value.trim()||null,status:'pending'});msg.textContent=r.error?r.error.message:tr('sent');msg.className='msg '+(r.error?'error':'success');if(!r.error)e.target.reset()};return}if(v==='notices'){d.innerHTML='<h2>'+tr('notices')+'</h2>'+window._notices.map(n=>'<div class="notice"><b>'+escapeHtml(n.title)+'</b><p class="sub">'+escapeHtml(n.body)+'</p></div>').join('');return}d.innerHTML='<h2>'+tr(v)+'</h2><p class="sub">'+tr('dashboard')+' — '+profile.full_name+'</p><div class="rows"><div class="row"><span>'+tr('flat')+'</span><b>'+escapeHtml((unit.wing?unit.wing+'-':'')+(unit.unit_number||'—'))+'</b></div><div class="row"><span>Email</span><b>'+escapeHtml(profile.email)+'</b></div><div class="row"><span>Role</span><b>MEMBER</b></div></div>'}function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function signout(){await db.auth.signOut();location.href='portal.html'}document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-v]').forEach(x=>x.classList.remove('active'));b.classList.add('active');const v=b.dataset.v;if(v==='home'){document.getElementById('home').classList.remove('hidden');document.getElementById('detail').classList.add('hidden')}else view(v)});document.getElementById('lang').onchange=e=>{lang=e.target.value;applyLang();if(profile){document.getElementById('welcome').textContent=tr('dashboard')+' — '+profile.full_name;loadData()}};document.getElementById('lang').value=lang;init().catch(console.error);</script></body></html>
