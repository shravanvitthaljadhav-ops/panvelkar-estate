name: Final Marathi Text Fix
on:
  workflow_dispatch:
  push:
    paths:
      - .github/marathi-final-fix-trigger.txt
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fix final Marathi wording and bilingual labels
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess,time
          for attempt in range(5):
            subprocess.run(['git','fetch','origin','main'],check=True)
            subprocess.run(['git','reset','--hard','origin/main'],check=True)
            p=Path('index.html');s=p.read_text(encoding='utf-8')
            r={
              'panvelkar-stanford-चिन्ह.svg':'panvelkar-stanford-logo.svg',
              'उद्वाहन यंत्रचा':'उद्वाहन यंत्राचा',
              'संकेतस्थळवर':'संकेतस्थळावर',
              '<a href="portal.html" class="login">सदस्य प्रवेश</a>':'<a href="portal.html" class="login">प्रवेश / Login</a>',
              '<small>अधिकृत संकेतस्थळ</small>':'<small>अधिकृत संकेतस्थळ / Official Website</small>',
              '<h3>सोसायटी सदस्य पोर्टल</h3>':'<h3>सदस्य पोर्टल / Member Portal</h3>',
              '<h3>सदस्य प्रवेश</h3>':'<h3>सदस्य प्रवेश / Member Login</h3>',
              '<small>सुरक्षित प्रवेश</small>':'<small>सुरक्षित प्रवेश / Secure Access</small>',
              '<h3>अभ्यागत नोंदणी</h3>':'<h3>अभ्यागत नोंदणी / Visitor Registration</h3>',
              '<h3>वीज जनित्र</h3>':'<h3>वीज जनित्र / Generator</h3>',
              '<h3>सुरक्षा व्यवस्था</h3>':'<h3>सुरक्षा व्यवस्था / Security</h3>',
              '<h3>उद्वाहन यंत्र</h3>':'<h3>उद्वाहन यंत्र / Lift</h3>',
              '<h3>नियमित पाणी पुरवठा</h3>':'<h3>नियमित पाणी पुरवठा / Water Supply</h3>',
              '<h3>बालकांसाठी खेळण्याची जागा</h3>':'<h3>बालकांसाठी खेळण्याची जागा / Play Area</h3>',
              'सोसायटीमध्ये उपलब्ध सुविधा / Available Facilities / Available Facilities':'सोसायटीमध्ये उपलब्ध सुविधा / Available Facilities',
              'सोसायटीमध्ये उपलब्ध सुविधा / Available Facilities / Available Facilities / Available Facilities':'सोसायटीमध्ये उपलब्ध सुविधा / Available Facilities',
              'ओपन पाणी सुविधा / Open Water Facility':'ओपन पार्किंग सुविधा / Open Parking',
              'ओपन पाणी सुविधा':'ओपन पार्किंग सुविधा / Open Parking',
              'नियमित नियमित पाणी पुरवठा':'नियमित पाणी पुरवठा / Water Supply',
              'R1A-809':'R1A-८०९',
              'R1A-1209':'R1A-१२०९',
              'R2-808':'R2-८०८',
              'R3-808':'R3-८०८',
              'R4-808':'R4-८०८'
            }
            for a,b in r.items(): s=s.replace(a,b)
            p.write_text(s,encoding='utf-8')
            subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
            subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
            subprocess.run(['git','add','index.html'],check=True)
            if subprocess.run(['git','diff','--cached','--quiet']).returncode==0: break
            subprocess.run(['git','commit','-m','Fix fire flat Marathi numerals and facility heading [fire-flat-fix]'],check=True)
            if subprocess.run(['git','push','origin','HEAD:main']).returncode==0: break
            time.sleep(2)
          else: raise SystemExit('Push failed')
          PY
      - name: Validate final homepage
        run: |
          python3 <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'id="languageSelect"' not in s
          assert 'const translations=' not in s
          assert 'STANFORD_LOCALIZATION_V3' not in s
          assert 'panvelkar-stanford-logo.svg' in s
          assert 'ओपन पार्किंग सुविधा / Open Parking' in s
          assert 'ओपन पाणी सुविधा' not in s
          for x in ['Garden','Gym','About Our Society','Quick Links','Admin Login','Co-operative Housing Society','Regular flats','Fire flats','8th Floor','12th Floor']:
            assert x not in s, f'Leftover English: {x}'
          for x in ['सोसायटीची थोडक्यात माहिती','विंग व सदनिका तपशील','सोसायटीमध्ये उपलब्ध सुविधा / Available Facilities','प्रवेश / Login','अभ्यागत नोंदणी / Visitor Registration','वीज जनित्र / Generator','सुरक्षा व्यवस्था / Security','उद्वाहन यंत्र / Lift','नियमित पाणी पुरवठा / Water Supply','R1A-८०९','R1A-१२०९','R2-८०८','R3-८०८','R4-८०८']:
            assert x in s, f'Missing final content: {x}'
          assert 'Available Facilities / Available Facilities' not in s
          print('Final Marathi + English labels and fire-flat numerals validation passed')
          PY
