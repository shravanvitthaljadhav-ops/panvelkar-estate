name: Validate Public Society Website

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate public homepage and gallery assets
        shell: python
        run: |
          from pathlib import Path
          index = Path('index.html')
          if not index.exists():
              raise SystemExit('index.html is missing')
          html = index.read_text(encoding='utf-8')
          required = [
              'आपलं घर,', 'आपली सोसायटी', 'सोसायटीची थोडक्यात माहिती',
              'सोसायटीमध्ये उपलब्ध सुविधा', 'सूचना', 'कमिटी', 'दुकाने',
              'नियम व अटी', 'आणीबाणी संपर्क',
              'imagessociety-building-1.jpeg', 'imagessociety-building-2.jpeg',
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit('Missing required public-page content: ' + ', '.join(missing))
          for asset in ['imagessociety-building-1.jpeg', 'imagessociety-building-2.jpeg']:
              if not Path(asset).exists():
                  raise SystemExit(f'Missing gallery asset: {asset}')
          print('Public homepage validation passed.')
          print('No resident-data, complaints, document-upload, or portal mechanism is modified by this workflow.')