name: Validate Public Society Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply permanent number localization
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          marker = 'STANFORD_DIGIT_LOCALIZATION_V1'
          if marker not in html:
              script = r'''<script>
/* STANFORD_DIGIT_LOCALIZATION_V1 */
(function(){
  const digitSets={mr:'०१२३४५६७८९',en:'0123456789',hi:'०१२३४५६७८९'};
  function localizeDigits(lang){
    const target=digitSets[lang]||digitSets.mr;
    const latin='0123456789';
    const dev='०१२३४५६७८९';
    const mapToLatin={};
    for(let i=0;i<10;i++){mapToLatin[latin[i]]=latin[i];mapToLatin[dev[i]]=latin[i];}
    const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,{acceptNode(node){
      const p=node.parentElement;
      if(!p||['SCRIPT','STYLE','SELECT','OPTION'].includes(p.tagName)) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }});
    const nodes=[];
    while(walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(node=>{
      const normalized=node.nodeValue.replace(/[०१२३४५६७८९0-9]/g,ch=>mapToLatin[ch]);
      node.nodeValue=target==='0123456789'?normalized:normalized.replace(/[0-9]/g,ch=>target[Number(ch)]);
    });
  }
  document.addEventListener('DOMContentLoaded',function(){
    const select=document.getElementById('languageSelect');
    if(!select) return;
    const apply=function(){localizeDigits(select.value);};
    select.addEventListener('change',function(){setTimeout(apply,0);});
    setTimeout(apply,0);
  });
})();
</script>'''
              html = html.replace('</body>', script + '\n</body>', 1)
              p.write_text(html, encoding='utf-8')

      - name: Commit permanent number localization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Number localization already applied."
          else
            git commit -m "Add permanent Marathi Hindi English number localization [skip ci]"
            git push
          fi

      - name: Validate public homepage and gallery assets
        shell: python
        run: |
          from pathlib import Path

          index = Path('index.html')
          if not index.exists():
              raise SystemExit('index.html is missing')

          html = index.read_text(encoding='utf-8')
          required = [
              'आपलं घर,',
              'आपली सोसायटी',
              'सोसायटीची थोडक्यात माहिती',
              'सोसायटीमध्ये उपलब्ध सुविधा',
              'सूचना',
              'कमिटी',
              'दुकाने',
              'नियम व अटी',
              'आणीबाणी संपर्क',
              'imagessociety-building-1.jpeg',
              'imagessociety-building-2.jpeg',
          ]

          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit('Missing required public-page content: ' + ', '.join(missing))

          for asset in ['imagessociety-building-1.jpeg', 'imagessociety-building-2.jpeg']:
              if not Path(asset).exists():
                  raise SystemExit(f'Missing gallery asset: {asset}')

          print('Public homepage validation passed.')
          print('No resident-data, complaints, document-upload, or portal mechanism is modified by this workflow.')