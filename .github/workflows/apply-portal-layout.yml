name: Apply Public Prototype Review

on:
  push:
    branches: [prototype-public-review]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-review:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare review gallery without photos
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          h = p.read_text(encoding='utf-8')
          # Remove embedded photo binaries for this review build only.
          h = re.sub(
              r'<img\s+src="data:image/[^;]+;base64,[^"]+"([^>]*)>',
              r'<div class="gallery-placeholder"\1>फोटो लवकरच उपलब्ध</div>',
              h,
              flags=re.I,
          )
          if '.gallery-placeholder' not in h:
              h = h.replace('</style>', '.gallery-placeholder{width:100%;height:100%;min-height:150px;display:flex;align-items:center;justify-content:center;background:var(--cream);color:var(--ink-soft);font-weight:600;border-radius:10px;border:1px dashed var(--line)}\n</style>', 1)
          p.write_text(h, encoding='utf-8')
      - name: Commit review build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Prepare public prototype review without photos [skip ci]"
          git push
