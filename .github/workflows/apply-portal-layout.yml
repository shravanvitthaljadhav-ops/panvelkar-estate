name: Apply Portal Left Right Layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  layout:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, 'Apply Portal Left Right Layout') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply unified Stanford portal layout
        shell: python
        run: |
          from pathlib import Path
          portal = Path('portal.html')
          if not portal.exists(): raise SystemExit('portal.html not found')
          original = portal.read_text(encoding='utf-8')
          marker = '/* STANFORD LEFT RIGHT PORTAL LAYOUT v2 */'
          if marker in original:
              print('Portal layout v2 already present; no changes needed.')
              raise SystemExit(0)
          css = r'''<style>
          /* STANFORD LEFT RIGHT PORTAL LAYOUT v2 */
          /* Formatting-only layer. Existing portal JS/Supabase mechanisms remain untouched. */
          #member{display:grid;grid-template-columns:minmax(0,255px) minmax(0,1fr);gap:18px;align-items:start}
          #member>.grid{grid-column:1/-1}
          #member>.section{display:contents}
          #member>.section>h2{grid-column:1;color:var(--stan-teal,#1f4b43);font-size:13px;letter-spacing:.04em;text-transform:uppercase;margin:4px 0 0;padding:0 8px;align-self:end}
          #member>.section>.serviceGrid{grid-column:1;display:flex;flex-direction:column;gap:7px;background:var(--stan-teal,#1f4b43);border-radius:16px;padding:12px;position:relative;align-self:start}
          #member>.section>.serviceGrid .serviceTile{width:100%;min-height:48px;border:1px solid transparent;border-radius:10px;background:transparent;color:#fff;padding:11px 13px;text-align:left;display:flex;align-items:center;gap:8px;box-shadow:none}
          #member>.section>.serviceGrid .serviceTile:hover,#member>.section>.serviceGrid .serviceTile:focus,#member>.section>.serviceGrid .serviceTile.active{background:var(--stan-gold,#c9a227);color:var(--stan-teal,#1f4b43);border-color:var(--stan-gold,#c9a227);box-shadow:none;outline:none}
          #member>#memberPanel{grid-column:2;grid-row:2 / span 6;background:var(--stan-cream,#fbf7ef);border:1px solid var(--stan-line,#e3d8bd);border-radius:16px;padding:20px;margin:0;min-width:0;align-self:start;position:sticky;top:18px}
          #memberPanel h2,#memberPanel h3{color:var(--stan-teal,#1f4b43)}
          #memberPanel table th{background:var(--stan-teal,#1f4b43);color:#fff}
          #memberPanel .detailCard{background:#fff;border-color:var(--stan-line,#e3d8bd);box-shadow:none}
          #memberPanel input,#memberPanel textarea,#memberPanel select{border-color:var(--stan-line,#e3d8bd);background:#fff}
          #memberPanel .dark{background:var(--stan-brick,#c1502e);color:#fff}
          @media(max-width:850px){#member{display:block}#member>.grid{display:grid;grid-template-columns:repeat(2,1fr);margin-bottom:16px}#member>.section{display:block;margin:0 0 10px}#member>.section>h2{font-size:12px;margin:12px 0 6px}#member>.section>.serviceGrid{display:grid;grid-template-columns:1fr 1fr;position:static}#member>#memberPanel{position:static;margin-top:14px}}
          @media(max-width:520px){#member>.grid{grid-template-columns:1fr}#member>.section>.serviceGrid{grid-template-columns:1fr}}
          </style>'''
          if '</head>' not in original: raise SystemExit('head tag not found')
          portal.write_text(original.replace('</head>', css + '</head>', 1), encoding='utf-8')
          print('Unified member left navigation/right information formatting applied.')
