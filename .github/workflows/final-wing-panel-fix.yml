name: Final Wing Panel Fix
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[wing-fix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          def enddiv(t,st):
            d=0
            sub=t[st:]
            for m in re.finditer(r'<div\b[^>]*>|</div>',sub,re.I|re.S):
              d += 1 if m.group(0).lower().startswith('<div') else -1
              if d==0: return st+m.end()
            return -1
          fs=s.find('<div class="embedded-facilities">')
          if fs<0: raise SystemExit('embedded facilities not found')
          fe=enddiv(s,fs)
          if fe<0: raise SystemExit('facilities close not found')
          block=s[fs:fe]
          for x in ['गार्डन','जिम','Garden','Gym']:
            block=block.replace(x,'')
          block=block.replace('पार्किंग सुविधा','ओपन पाणी सुविधा').replace('पार्किंग','ओपन पाणी सुविधा')
          block=block.replace('पाणी पुरवठा','नियमित पाणी पुरवठा')
          s=s[:fs]+s[fe:]
          aa=s.find('<section id="about"'); gg=s.find('<section id="gallery"',aa)
          about=s[aa:gg]
          ag=about.find('<div class="about-grid">')
          p1=about.find('<div class="panel">',ag)
          p1e=enddiv(about,p1)
          p2=about.find('<div class="panel">',p1e)
          p2e=enddiv(about,p2)
          if min(ag,p1,p1e,p2,p2e)<0: raise SystemExit('about panel structure not found')
          about=about[:p2e-6]+block+'\n'+about[p2e-6:]
          s=s[:aa]+about+s[gg:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate and commit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          aa=s.find('<section id="about"'); gg=s.find('<section id="gallery"',aa); about=s[aa:gg]
          def enddiv(t,st):
            d=0
            sub=t[st:]
            for m in re.finditer(r'<div\b[^>]*>|</div>',sub,re.I|re.S):
              d += 1 if m.group(0).lower().startswith('<div') else -1
              if d==0:return st+m.end()
            return -1
          ag=about.find('<div class="about-grid">'); p1=about.find('<div class="panel">',ag); p1e=enddiv(about,p1); p2=about.find('<div class="panel">',p1e); p2e=enddiv(about,p2); fs=about.find('<div class="embedded-facilities">')
          required=['class="wing-stats"','class="embedded-facilities"','विंग आणि फ्लॅट तपशील','४१४','५','१४','ओपन पाणी सुविधा','नियमित पाणी पुरवठा','R1A','R1B','R2','R3','R4']
          missing=[x for x in required if x not in about]
          if missing: raise SystemExit('Missing: '+', '.join(missing))
          if not (p2<fs<p2e): raise SystemExit('Facilities are outside right panel')
          if '<section id="amenities"' in s: raise SystemExit('Standalone amenities section remains')
          print('FINAL_LAYOUT_VALID')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'Already fixed'; exit 0; fi
          git commit -m 'Apply final Wing layout [wing-fix-applied]'
          git push
