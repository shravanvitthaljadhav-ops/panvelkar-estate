name: Final Wing Panel Fix
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[layout-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Place facilities inside right panel
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          aa=s.find('<section id="about"')
          gg=s.find('<section id="gallery"', aa)
          if aa<0 or gg<0: raise SystemExit('About/Gallery boundary not found')
          about=s[aa:gg]
          def balanced_block(text, start):
              depth=0
              for m in re.finditer(r'<div\b[^>]*>|</div>', text[start:], re.I):
                  if m.group(0).lower().startswith('<div'):
                      depth += 1
                  else:
                      depth -= 1
                      if depth == 0:
                          return text[start:start+m.end()], start+m.end()
              raise SystemExit('Unbalanced div block')
          # Extract the existing facilities block from the About section.
          fs=about.find('<div class="embedded-facilities">')
          if fs<0: raise SystemExit('Facilities block not found')
          embedded, fend=balanced_block(about, fs)
          about=about[:fs]+about[fend:]
          # Recalculate the right panel as the second .panel in the About section.
          panels=[m.start() for m in re.finditer(r'<div class="panel">', about)]
          if len(panels)<2: raise SystemExit('Two About panels not found')
          rp=panels[1]
          _, rend=balanced_block(about, rp)
          about=about[:rend-len('</div>')]+embedded+'\n'+about[rend-len('</div>'):]
          s=s[:aa]+about+s[gg:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate structure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          aa=s.find('<section id="about"'); gg=s.find('<section id="gallery"',aa)
          about=s[aa:gg]
          checks={
            'wing-stats':'class="wing-stats"' in about,
            'facilities':'class="embedded-facilities"' in about,
            'heading':'विंग आणि फ्लॅट तपशील' in about,
            '414':'४१४' in about,
            '5':'५' in about,
            '14':'१४' in about,
            'parking':'ओपन पाणी सुविधा' in about,
            'water':'नियमित पाणी पुरवठा' in about,
            'r1a':'R1A' in about and 'Fire flats – 2' in about,
            'r2':'R2' in about and 'Fire flats – 1' in about,
            'r3':'R3' in about and 'Fire flats – 1' in about,
            'r4':'R4' in about and 'Fire flats – 1' in about,
            'no-standalone':'<section id="amenities"' not in s,
          }
          print(checks)
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('Validation failed: '+', '.join(bad))
          # Confirm facilities are within the second About panel, after Wing heading.
          pos=about.find('class="embedded-facilities"')
          wing=about.find('<h3 data-i18n="wingTitle">')
          if pos<wing: raise SystemExit('Facilities appear before Wing heading')
          before=about[:pos]
          if before.count('<div class="panel">') != 2: raise SystemExit('Facilities are not inside the second panel')
          print('FINAL WING PANEL STRUCTURE OK')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'No changes needed'; exit 0; fi
          git commit -m 'Place facilities inside Wing Details panel [layout-applied]'
          git push