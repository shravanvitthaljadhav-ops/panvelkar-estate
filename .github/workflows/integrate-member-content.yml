name: Integrate member content enhancements
on:
  push:
    branches: [main]
    paths:
      - 'member-content-v2.js'
      - 'member-dashboard.html'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Inject member content script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('member-dashboard.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="member-content-v2.js"></script>'
          if tag not in s:
              marker='</body>'
              if marker not in s:
                  raise SystemExit('Could not find </body> in member-dashboard.html')
              s=s.replace(marker,tag+'\n'+marker,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add member-dashboard.html
          if git diff --cached --quiet; then
            echo 'No integration change required.'
          else
            git commit -m 'Integrate member content enhancements'
            git push origin main
          fi