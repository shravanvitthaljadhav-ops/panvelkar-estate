name: Integrate Marathi portal UI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Marathi UI script
        shell: bash
        run: |
          set -e
          for f in portal.html member-dashboard.html; do
            if [ -f "$f" ] && ! grep -q 'portal-marathi-ui.js' "$f"; then
              python - "$f" <<'PY'
import sys
p=sys.argv[1]
s=open(p,encoding='utf-8').read()
needle='</body>'
if needle not in s:
    raise SystemExit(f'No body close tag in {p}')
s=s.replace(needle,'<script src="portal-marathi-ui.js"></script>\n'+needle,1)
open(p,'w',encoding='utf-8').write(s)
PY
            fi
          done
      - name: Commit integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add portal.html member-dashboard.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Make member and admin portals Marathi-first'
          git push