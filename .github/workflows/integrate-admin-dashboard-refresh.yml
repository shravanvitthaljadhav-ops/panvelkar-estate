name: Integrate Admin Dashboard Refresh
on:
  push:
    branches: [main]
    paths:
      - 'admin-dashboard-refresh.js'
      - '.github/workflows/integrate-admin-dashboard-refresh.yml'
permissions:
  contents: write
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inject dashboard refresh
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('portal.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="admin-dashboard-refresh.js"></script>'
          if tag not in s:
              marker='</body>'
              if marker not in s: raise SystemExit('portal.html has no closing body tag')
              s=s.replace(marker,tag+'\n'+marker,1)
              p.write_text(s,encoding='utf-8')
              print('Injected admin dashboard refresh')
          else: print('Already injected')
          PY
      - name: Commit integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add portal.html
          if git diff --cached --quiet; then echo 'No integration change needed'; exit 0; fi
          git commit -m 'Wire admin dashboard refresh'
          git push
