name: Integrate admin gallery navigation fix
on:
  push:
    branches: [main]
    paths:
      - 'admin-gallery-nav-fix.js'
      - 'portal.html'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Inject admin gallery nav fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('portal.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="admin-gallery-nav-fix.js"></script>'
          if tag not in s:
              marker='</body>'
              if marker not in s: raise SystemExit('Missing </body>')
              s=s.replace(marker,tag+'\n'+marker,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add portal.html
          if git diff --cached --quiet; then echo 'No integration change required.'; else git commit -m 'Integrate admin gallery navigation fix'; git push origin main; fi