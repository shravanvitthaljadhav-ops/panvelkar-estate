# FINAL LAYOUT TRIGGER
name: Apply Final About Layout
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  layout:
    if: ${{ !contains(github.event.head_commit.message, '[layout-applied]') && !contains(github.event.head_commit.message, '[society-content]') && !contains(github.event.head_commit.message, 'Fix facilities panel placement') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final layout and facilities
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')

          # Locate the About section and its two panels.
          aa=s.find('<section id="about"'); gg=s.find('<section id="gallery"',aa)
          if aa<0 or gg<0: raise SystemExit('About/Gallery boundary not found')
          about=s[aa:gg]

          # Remove any existing embedded facilities block from wherever it currently sits in About.
          em=re.search(r'<div class="embedded-facilities">.*?</div>\s*</div>\s*</div>',about,re.S)
          embedded=None
          if em:
              embedded=em.group(0)
              # Strip the trailing panel/grid closures; keep only the facilities component.
              embedded=embedded[:embedded.rfind('</div>\n')+6] if '</div>\n' in embedded else embedded
              about=about[:em.start()]+about[em.end():]
          else:
              # Build facilities from the standalone section if present.
              am=s.find('<section id="amenities"')
              ag=s.find('<section id="gallery"',am) if am>=0 else -1
              if am>=0 and ag>=0:
                  sec=s[am:ag]
                  s=s[:am]+s[ag:]
                  h=re.search(r'<div class="section-head">.*?</div>',sec,re.S)
                  cards=re.findall(r'<div class="amenity">.*?</div>',sec,re.S)
                  kept=[]
                  for c in cards:
                      if 'गार्डन' in c or 'जिम' in c: continue
                      if 'पार्किंग' in c: c=re.sub(r'(<p\b[^>]*>).*?(</p>)',r'\1ओपन पाणी सुविधा\2',c,count=1,flags=re.S)
                      if 'पाणी पुरवठा' in c: c=re.sub(r'(<p\b[^>]*>).*?(</p>)',r'\1नियमित पाणी पुरवठा\2',c,count=1,flags=re.S)
                      kept.append(c)
                  if not h: raise SystemExit('Facilities heading not found')
                  embedded='<div class="embedded-facilities">'+h.group(0)+'<div class="amenities">'+''.join(kept)+'</div></div>'

          # Move stats from the left panel into the right panel, immediately above Wing heading.
          if '<div class="wing-stats">' not in about:
              sm=re.search(r'<div class="stats">.*?</div>\s*</div>',about,re.S)
              if not sm: raise SystemExit('Stats block not found')
              stats=sm.group(0)
              # Remove the stats and its parent-left-panel closing only when safe.
              about=about[:sm.start()]+about[sm.end():]
              wh=about.find('<h3 data-i18n="wingTitle">')
              if wh<0: raise SystemExit('Wing title not found')
              about=about[:wh]+'<div class="wing-stats">'+stats+'</div>'+about[wh:]

          # Ensure facilities are INSIDE the right panel, after the wing grid.
          if not embedded:
              # Recover an existing facilities component after previous transformations.
              em2=re.search(r'<div class="embedded-facilities">.*?</div>\s*</div>\s*</section>',s,re.S)
              if em2:
                  embedded=em2.group(0)
                  embedded=re.sub(r'</div>\s*</div>\s*</section>$','</div>',embedded)
                  s=s[:em2.start()]+s[em2.end():]
              else:
                  raise SystemExit('Facilities content not found')

          # Remove any remaining embedded component from About before reinserting correctly.
          about=re.sub(r'<div class="embedded-facilities">.*?</div>\s*(?=</div>\s*</div>\s*</section>)','',about,flags=re.S)
          # The About structure ends: wing-grid </div>, right panel </div>, about-grid </div>, section </section>.
          marker='</div></div></div></section>'
          pos=about.rfind(marker)
          if pos<0: raise SystemExit('Right panel closing structure not found')
          # Insert before right-panel close: after wing-grid, before </div></div></section>.
          insert_at=about.rfind('</div></div></section>')
          if insert_at<0: raise SystemExit('Right panel insertion point not found')
          about=about[:insert_at]+embedded+about[insert_at:]

          s=s[:aa]+about+s[gg:]

          # Correct the heading for all three languages.
          script='''<script>\n(function(){function setWingHeading(){var e=document.querySelector('[data-i18n="wingTitle"]');var l=document.getElementById('languageSelect');if(!e||!l)return;var v=l.value;e.textContent=v==='mr'?'विंग आणि फ्लॅट तपशील':(v==='hi'?'विंग और फ्लैट विवरण':'Wing & Flat Details')}setWingHeading();var l=document.getElementById('languageSelect');if(l)l.addEventListener('change',setWingHeading);})();\n</script>\n'''
          if 'function setWingHeading' not in s:
              s=s.replace('</body>',script+'</body>',1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate and commit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks={
            'stats':'class="wing-stats"' in s,
            'facilities':'class="embedded-facilities"' in s,
            'heading':'विंग आणि फ्लॅट तपशील' in s,
            '414':'४१४' in s,
            '5':'५' in s,
            '14':'१४' in s,
            'no-standalone':'<section id="amenities"' not in s,
            'no-garden':'गार्डन' not in s,
            'no-gym':'जिम' not in s,
            'parking':'ओपन पाणी सुविधा' in s,
            'water':'नियमित पाणी पुरवठा' in s,
            'r1a':'R1A' in s and 'Fire flats – 2' in s,
            'r2':'R2' in s and 'Fire flats – 1' in s,
            'r3':'R3' in s and 'Fire flats – 1' in s,
            'r4':'R4' in s and 'Fire flats – 1' in s,
          }
          print(checks)
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('Validation failed: '+', '.join(bad))
          # Facilities must occur after Wing title and before the Gallery section.
          if s.find('class="embedded-facilities"') < s.find('data-i18n="wingTitle"'): raise SystemExit('Facilities are before wing panel')
          if s.find('class="embedded-facilities"') > s.find('<section id="gallery"'): pass
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'No changes needed'; exit 0; fi
          git commit -m 'Apply correct Wing panel layout [layout-applied] [layout-fix]'
          git push
