# FINAL LAYOUT TRIGGER
name: Apply Final About Layout
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  layout:
    if: ${{ !contains(github.event.head_commit.message, '[layout-applied]') && !contains(github.event.head_commit.message, '[society-content]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final layout and facilities
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          def block(text,start,tag='div'):
              i=text.find(start)
              if i<0: raise SystemExit(f'Block not found: {start}')
              om=re.search(r'<'+tag+r'\b[^>]*>',text[i:])
              if not om: raise SystemExit(f'Opening tag not found: {start}')
              a=i+om.start(); depth=0; pat=re.compile(r'<(/?)'+tag+r'\b[^>]*>',re.I)
              for m in pat.finditer(text,a):
                  depth += -1 if m.group(1) else 1
                  if depth==0: return a,m.end(),text[a:m.end()]
              raise SystemExit(f'Unclosed {tag} block: {start}')
          a=s.find('<section id="amenities"'); b=s.find('<section id="gallery"',a)
          if a<0 or b<0: raise SystemExit('Amenities/Gallery boundary not found')
          amenities=s[a:b]; s=s[:a]+s[b:]
          blocks=[]; work=amenities
          while '<div class="amenity">' in work:
              x,y,z=block(work,'<div class="amenity">'); blocks.append(z); work=work[:x]+work[y:]
          kept=[]
          for z in blocks:
              if 'गार्डन' in z or 'जिम' in z: continue
              if 'पार्किंग' in z:z=re.sub(r'(<p>).*?(</p>)',r'\1ओपन पाणी सुविधा\2',z,count=1,flags=re.S)
              if 'पाणी पुरवठा' in z:z=re.sub(r'(<p>).*?(</p>)',r'\1नियमित पाणी पुरवठा\2',z,count=1,flags=re.S)
              kept.append(z)
          hm=re.search(r'(<div class="section-head">.*?</div>)',amenities,re.S)
          if not hm: raise SystemExit('Facilities heading not found')
          embedded='<div class="embedded-facilities">'+hm.group(1)+'<div class="amenities">'+''.join(kept)+'</div></div>'
          aa=s.find('<section id="about"'); gg=s.find('<section id="gallery"',aa)
          if aa<0 or gg<0: raise SystemExit('About/Gallery boundary not found')
          about=s[aa:gg]
          x,y,stats=block(about,'<div class="stats">'); about=about[:x]+about[y:]
          wing=about.find('<h3 data-i18n="wingTitle">')
          if wing<0: raise SystemExit('Wing title not found')
          about=about[:wing]+'<div class="wing-stats">'+stats+'</div>'+about[wing:]
          close=about.rfind('</section>')
          if close<0: raise SystemExit('About section closing tag not found')
          about=about[:close]+embedded+about[close:]
          s=s[:aa]+about+s[gg:]
          css='''<style>\n.embedded-facilities{margin-top:24px;padding-top:18px;border-top:1px solid rgba(18,48,71,.12)}\n.embedded-facilities .section-head{margin-bottom:14px}\n.embedded-facilities .section-head h2{font-size:1.35rem}\n.embedded-facilities .section-head p{display:none}\n.embedded-facilities .amenities{max-width:none;margin:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}\n.embedded-facilities .amenity{padding:12px}\n.embedded-facilities .amenity-icon{width:44px;height:44px;font-size:1.2rem;margin-bottom:8px}\n.embedded-facilities .amenity h3{font-size:1rem}\n.embedded-facilities .amenity p{font-size:.8rem}\n.wing-stats{margin-bottom:18px}.wing-stats .stats{margin:0}\n@media(max-width:950px){.embedded-facilities .amenities{grid-template-columns:repeat(2,minmax(0,1fr))}}\n@media(max-width:560px){.embedded-facilities .amenities{grid-template-columns:1fr}}\n</style>\n'''
          if '.embedded-facilities{' not in s:s=s.replace('</head>',css+'</head>',1)
          required=['४१४</strong><span data-i18n="flats">फ्लॅट्स','५</strong><span data-i18n="wings">विंग्स','१४</strong><span data-i18n="shops">दुकाने','R1A','R1B','R2','R3','R4','Fire Emergency Guidance','सोसायटीमध्ये उपलब्ध सुविधा','पार्किंग','सिक्युरिटी','लिफ्ट','जनरेटर','पाणी पुरवठा','प्ले एरिया','श्री. विनय ठोबरे','श्रीमती कविता गावडे']
          for x in required:
              if x not in s: raise SystemExit('Missing required content: '+x)
          if '<section id="amenities"' in s: raise SystemExit('Old separate amenities section remains')
          if '\\g<1>' in s: raise SystemExit('Malformed wing markup remains')
          if 'गार्डन' in embedded or 'जिम' in embedded: raise SystemExit('Removed facilities remain')
          if 'पार्किंग</h3><p>ओपन पाणी सुविधा</p>' not in embedded: raise SystemExit('Parking description not updated')
          if 'पाणी पुरवठा</h3><p>नियमित पाणी पुरवठा</p>' not in embedded: raise SystemExit('Water description not updated')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate and commit
        shell: bash
        run: |
          grep -q 'class="wing-stats"' index.html
          grep -q 'class="embedded-facilities"' index.html
          grep -q 'सोसायटीमध्ये उपलब्ध सुविधा' index.html
          grep -q '४१४</strong><span data-i18n="flats">फ्लॅट्स' index.html
          grep -q 'R2</strong><p data-i18n="r2">Regular flats – 96<br>Fire flats – 1' index.html
          if grep -q '<section id="amenities"' index.html; then exit 1; fi
          if grep -q '\\g<1>' index.html; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Apply final facilities layout [layout-applied] [layout-fix]'
          git push
