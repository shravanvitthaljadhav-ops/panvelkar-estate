# FINAL LAYOUT TRIGGER
name: Apply Final About Layout
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  layout:
    if: ${{ !contains(github.event.head_commit.message, '[layout-applied]') && !contains(github.event.head_commit.message, '[society-content]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final layout and facilities
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          def block(text,start,tag='div'):
              i=text.find(start)
              if i<0: raise SystemExit(f'Block not found: {start}')
              om=re.search(r'<'+tag+r'\b[^>]*>',text[i:])
              if not om: raise SystemExit(f'Opening tag not found: {start}')
              a=i+om.start(); depth=0; pat=re.compile(r'<(/?)'+tag+r'\b[^>]*>',re.I)
              for m in pat.finditer(text,a):
                  depth += -1 if m.group(1) else 1
                  if depth==0: return a,m.end(),text[a:m.end()]
              raise SystemExit(f'Unclosed {tag} block: {start}')

          a=s.find('<section id="amenities"')
          b=s.find('<section id="gallery"',a) if a>=0 else -1
          embedded=None
          if a>=0 and b>=0:
              amenities=s[a:b]; s=s[:a]+s[b:]
              blocks=[]; work=amenities
              while '<div class="amenity">' in work:
                  x,y,z=block(work,'<div class="amenity">'); blocks.append(z); work=work[:x]+work[y:]
              kept=[]
              for z in blocks:
                  if 'गार्डन' in z or 'जिम' in z: continue
                  if 'पार्किंग' in z:
                      z=re.sub(r'(<p\b[^>]*>).*?(</p>)',r'\1ओपन पाणी सुविधा\2',z,count=1,flags=re.S)
                  if 'पाणी पुरवठा' in z:
                      z=re.sub(r'(<p\b[^>]*>).*?(</p>)',r'\1नियमित पाणी पुरवठा\2',z,count=1,flags=re.S)
                  kept.append(z)
              hm=re.search(r'(<div class="section-head">.*?</div>)',amenities,re.S)
              if not hm: raise SystemExit('Facilities heading not found')
              embedded='<div class="embedded-facilities">'+hm.group(1)+'<div class="amenities">'+''.join(kept)+'</div></div>'
          else:
              m=re.search(r'<div class="embedded-facilities">.*?</div>\s*</div>\s*</section>',s,re.S)
              if not m: raise SystemExit('Neither old amenities section nor embedded facilities found')
              embedded=m.group(0).replace('कार्ड व ओपन पार्किंग सुविधा','ओपन पाणी सुविधा').replace('अखंडित पाणी पुरवठा व्यवस्था','नियमित पाणी पुरवठा')
              embedded=re.sub(r'<div class="amenity">(?:(?!</div>).)*?गार्डन(?:(?!</div>).)*?</div>','',embedded,flags=re.S)
              embedded=re.sub(r'<div class="amenity">(?:(?!</div>).)*?जिम(?:(?!</div>).)*?</div>','',embedded,flags=re.S)

          aa=s.find('<section id="about"'); gg=s.find('<section id="gallery"',aa)
          if aa<0 or gg<0: raise SystemExit('About/Gallery boundary not found')
          about=s[aa:gg]

          if '<div class="wing-stats">' not in about:
              x,y,stats=block(about,'<div class="stats">')
              about=about[:x]+about[y:]
              wing=about.find('<h3 data-i18n="wingTitle">')
              if wing<0: raise SystemExit('Wing title not found')
              about=about[:wing]+'<div class="wing-stats">'+stats+'</div>'+about[wing:]

          if '<div class="embedded-facilities">' not in about:
              close=about.rfind('</section>')
              if close<0: raise SystemExit('About section closing tag not found')
              about=about[:close]+embedded+about[close:]
          else:
              old=re.search(r'<div class="embedded-facilities">.*?</div>\s*</div>\s*</section>',about,re.S)
              if old: about=about[:old.start()]+embedded+about[old.end():]

          s=s[:aa]+about+s[gg:]

          script='''<script>\n(function(){function setWingHeading(){var e=document.querySelector('[data-i18n="wingTitle"]');var l=document.getElementById('languageSelect');if(!e||!l)return;var v=l.value;e.textContent=v==='mr'?'विंग आणि फ्लॅट तपशील':(v==='hi'?'विंग और फ्लैट विवरण':'Wing & Flat Details')}setWingHeading();var l=document.getElementById('languageSelect');if(l)l.addEventListener('change',setWingHeading);})();\n</script>\n'''
          if 'विंग आणि फ्लॅट तपशील' not in s: s=s.replace('</body>',script+'</body>',1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate and commit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks={
            'wing-stats':'class="wing-stats"' in s,
            'embedded-facilities':'class="embedded-facilities"' in s,
            'facility-heading':'सोसायटीमध्ये उपलब्ध सुविधा' in s,
            '414':'४१४' in s,
            'five':'५' in s,
            'fourteen':'१४' in s,
            'marathi-wing-heading':'विंग आणि फ्लॅट तपशील' in s,
            'no-amenities-section':'<section id="amenities"' not in s,
            'no-g1':'\\g<1>' not in s,
            'no-garden':'गार्डन' not in s,
            'no-gym':'जिम' not in s,
            'parking':'ओपन पाणी सुविधा' in s,
            'water':'नियमित पाणी पुरवठा' in s,
            'r2-fire':'R2' in s and 'Fire flats – 1' in s,
            'r3-fire':'R3' in s and 'Fire flats – 1' in s,
            'r4-fire':'R4' in s and 'Fire flats – 1' in s,
          }
          bad=[k for k,v in checks.items() if not v]
          print('LAYOUT VALIDATION:', checks)
          if bad: raise SystemExit('Validation failed: '+', '.join(bad))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'No changes needed'; exit 0; fi
          git commit -m 'Apply Marathi wing layout [layout-applied] [layout-fix]'
          git push
