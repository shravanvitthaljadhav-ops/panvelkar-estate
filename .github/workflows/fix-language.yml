name: Fix public language selector

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add working Marathi English Hindi switcher
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          h = p.read_text(encoding='utf-8')
          marker = '/* STANFORD_LANGUAGE_SWITCHER_V2 */'
          if marker not in h:
              script = r'''<script>
/* STANFORD_LANGUAGE_SWITCHER_V2 */
(function(){
  const translations={
    en:{
      'आमच्याबद्दल':'About','सुविधा':'Facilities','गॅलरी':'Gallery','सूचना':'Notices','कमिटी':'Committee','दुकाने':'Shops','सदस्य लॉगिन':'Member Login',
      'आपलं घर,':'Our Home,','आपली सोसायटी':'Our Society','विश्वास, पारदर्शकता आणि काळजी यांच्या माध्यमातून एक मजबूत समुदाय घडवत आहोत.':'Building a strong community through trust, transparency and care.',
