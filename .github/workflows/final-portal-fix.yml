name: Final Portal Fix
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix public image paths
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('src="imagessociety-building-1.jpeg"','src="Society pictures/imagessociety-building-1.jpeg"')
          s=s.replace('src="imagessociety-building-2.jpeg"','src="Society pictures/imagessociety-building-2.jpeg"')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Add portal auth fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('portal.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="portal-auth-fix.js"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit final fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html portal.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix public gallery paths and portal login'
          git push
