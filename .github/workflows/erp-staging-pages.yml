name: Society ERP staging preview

on:
  push:
    branches:
      - feature/society-erp-phase1
    paths:
      - "staging-site/**"
      - ".github/workflows/erp-staging-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: society-erp-staging-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload safe demo site
        uses: actions/upload-pages-artifact@v3
        with:
          path: staging-site
      - name: Deploy staging preview
        id: deployment
        uses: actions/deploy-pages@v4
