name: Build Member Dashboard V2 (staging)

on:
  push:
    branches: [member-dashboard-v2-staging]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4

      - name: Apply portal integration
        run: python3 scripts/upgrade_portal.py

      - name: Validate portal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('portal.html').read_text(encoding='utf-8')
          required = [
              'STANFORD MEMBER DASHBOARD V2',
              'Garden Function Booking',
              'garden_area_booking_requests',
              'Garden Booking Requests',
              'languageSelect',
              'Pending Maintenance',
              'Open Complaint',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('Missing integration markers: ' + ', '.join(missing))
          print('Portal V2 validation passed.')
          PY

      - name: Commit generated portal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add portal.html
          git diff --cached --quiet || git commit -m 'Integrate finalized member dashboard and admin workflows'
          git push
