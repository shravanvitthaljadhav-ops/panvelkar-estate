name: Deploy Marathi Portal UI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate Marathi UI
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
from pathlib import Path
for name in ('portal.html','member-dashboard.html'):
    p=Path(name)
    if not p.exists():
        raise SystemExit(f'{name} missing')
    s=p.read_text(encoding='utf-8')
    tag='<script src="portal-marathi-ui.js"></script>'
    if tag not in s:
        s=s.replace('</body>', tag+'\n</body>', 1)
        p.write_text(s,encoding='utf-8')
PY
      - name: Commit Marathi UI integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add portal.html member-dashboard.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Deploy Marathi member and admin portal UI'
          git push